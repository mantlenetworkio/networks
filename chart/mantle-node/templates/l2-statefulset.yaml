apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "mantle-node.l2.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mantle-node.l2.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "mantle-node.l2.name" . }}
  replicas: 1
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      {{- include "mantle-node.l2.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mantle-node.l2.selectorLabels" . | nindent 8 }}
        {{- with .Values.l2.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Roll the pod whenever init-scripts change (e.g. snapshot URL flip).
        checksum/init-scripts: {{ include (print $.Template.BasePath "/configmap-init-scripts.yaml") . | sha256sum }}
        {{- with .Values.l2.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "mantle-node.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 120
      initContainers:
        - name: fetch-genesis
          image: "{{ .Values.initImage.repository }}:{{ .Values.initImage.tag }}"
          imagePullPolicy: {{ .Values.initImage.pullPolicy }}
          command:
            - /bin/sh
            - /scripts/fetch-genesis.sh
          volumeMounts:
            - name: init-scripts
              mountPath: /scripts
            - name: config
              mountPath: /config
        - name: fetch-snapshot
          image: "{{ .Values.l2.snapshot.image.repository }}:{{ .Values.l2.snapshot.image.tag }}"
          imagePullPolicy: {{ .Values.l2.snapshot.image.pullPolicy }}
          command:
            - /bin/sh
            - /scripts/fetch-snapshot.sh
          volumeMounts:
            - name: init-scripts
              mountPath: /scripts
            - name: data
              mountPath: {{ .Values.l2.persistence.mountPath }}
      containers:
        - name: l2-client
          image: "{{ .Values.l2.image.repository }}:{{ .Values.l2.image.tag }}"
          imagePullPolicy: {{ .Values.l2.image.pullPolicy }}
          {{- with .Values.l2.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.l2.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.l2.ports.http }}
              protocol: TCP
            - name: ws
              containerPort: {{ .Values.l2.ports.ws }}
              protocol: TCP
            - name: auth
              containerPort: {{ .Values.l2.ports.auth }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.l2.ports.metrics }}
              protocol: TCP
            - name: p2p-tcp
              containerPort: {{ .Values.l2.ports.p2p }}
              protocol: TCP
            - name: p2p-udp
              containerPort: {{ .Values.l2.ports.p2p }}
              protocol: UDP
          {{- if .Values.l2.probes.enabled }}
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: {{ div .Values.l2.probes.startupSeconds 10 }}
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          {{- end }}
          resources:
            {{- toYaml .Values.l2.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.l2.persistence.mountPath }}
            - name: secrets
              mountPath: /secret
              readOnly: true
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: init-scripts
          configMap:
            name: {{ include "mantle-node.configScriptsName" . }}
            defaultMode: 0755
        - name: secrets
          secret:
            secretName: {{ include "mantle-node.secretName" . }}
            defaultMode: 0400
        - name: config
          emptyDir: {}
      {{- with .Values.l2.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.l2.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.l2.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.l2.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "mantle-node.l2.labels" . | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml .Values.l2.persistence.accessModes | nindent 10 }}
        {{- if .Values.l2.persistence.storageClass }}
        storageClassName: {{ .Values.l2.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.l2.persistence.size | quote }}
  {{- end }}
