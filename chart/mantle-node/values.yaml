# =============================================================================
# Default values for mantle-node chart.
#
# This file defines the *schema* and sensible defaults that are common across
# all Mantle networks (hoodi / sepolia / mainnet). Network-specific values
# (image tags, command/args, env vars, sequencer URLs, P2P static peers) live
# in the per-network override files:
#
#   - hoodi.values.yaml
#   - sepolia.values.yaml
#   - mainnet.values.yaml
#
# Usage:
#   helm install my-hoodi    ./chart/mantle-node -f ./chart/mantle-node/hoodi.values.yaml    \
#     --set l1.rpc=https://... --set l1.beacon=https://...
#
#   helm install my-sepolia  ./chart/mantle-node -f ./chart/mantle-node/sepolia.values.yaml  \
#     --set l1.rpc=https://... --set l1.beacon=https://...
#
#   helm install my-mainnet  ./chart/mantle-node -f ./chart/mantle-node/mainnet.values.yaml  \
#     --set l1.rpc=https://... --set l1.beacon=https://...
# =============================================================================

# Which network this release targets. Must be one of: hoodi, sepolia, mainnet.
# Set by the per-network override files; leave empty in default values.
network: ""

# Common name override. By default, resources are prefixed with the release name.
nameOverride: ""
fullnameOverride: ""

# -----------------------------------------------------------------------------
# L1 endpoints (REQUIRED). Must be provided by the user at install time, e.g.:
#   --set l1.rpc=https://...  --set l1.beacon=https://...
# Beacon may be set to the Mantle DA indexer instead of an L1 beacon node.
# -----------------------------------------------------------------------------
l1:
  rpc: ""
  beacon: ""

# -----------------------------------------------------------------------------
# How to obtain genesis.json and rollup.json. By default we fetch them from
# the mantlenetworkio/networks GitHub repo via an initContainer (genesis.json
# is ~9MB and exceeds the 1MB ConfigMap limit, so we cannot embed it).
#
# You may override `genesisUrl` / `rollupUrl` to fetch from any HTTPS URL.
# -----------------------------------------------------------------------------
config:
  source:
    repo: mantlenetworkio/networks
    # Git ref (branch / tag / commit) inside the repo to pull files from.
    # Per-network override files set this to the appropriate branch.
    ref: main
    # Subdirectory inside the repo holding genesis.json and rollup.json.
    subdir: ""
  # If non-empty, used instead of the GitHub source above.
  genesisUrl: ""
  rollupUrl: ""

# -----------------------------------------------------------------------------
# Secrets. If left empty, the chart auto-generates them on first install and
# persists them across upgrades (using a lookup of the existing Secret).
#
# Provide your own values to use specific keys, e.g. for high-availability /
# multi-replica deployments where you want a stable peer identity.
# -----------------------------------------------------------------------------
secrets:
  # 32-byte hex string used as the engine-API JWT secret.
  jwtSecret: ""
  # 32-byte hex string used as the op-node libp2p private key.
  p2pNodeKey: ""

# -----------------------------------------------------------------------------
# Init container image used to fetch genesis.json / rollup.json. Override only
# if you need to pin a specific tag or pull from a private registry.
# -----------------------------------------------------------------------------
initImage:
  repository: curlimages/curl
  tag: "8.10.1"
  pullPolicy: IfNotPresent

# -----------------------------------------------------------------------------
# L2 execution client (op-reth on hoodi, op-geth on sepolia/mainnet).
#
# image, command, args are all set by the per-network override file.
# -----------------------------------------------------------------------------
l2:
  # "op-reth" or "op-geth". Set by the per-network override.
  kind: ""
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent

  # Container entrypoint binary. e.g. "op-reth" or "geth".
  command: []
  # Container arguments. See per-network overrides for full lists.
  args: []

  # Container ports. Defaults match the docker-compose files.
  ports:
    http: 8545
    ws: 8546
    auth: 8551
    metrics: 6060
    p2p: 9003

  # Service exposure. ClusterIP by default; switch to NodePort or LoadBalancer
  # if you need external access.
  service:
    type: ClusterIP
    annotations: {}
    # Per-port NodePort overrides (only used when type=NodePort).
    nodePorts:
      http: ""
      ws: ""

  resources:
    requests:
      cpu: "2"
      memory: "8Gi"
    limits:
      cpu: "4"
      memory: "8Gi"

  persistence:
    enabled: true
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 500Gi
    mountPath: /db

  # Liveness/readiness probes — port 8545 TCP.
  probes:
    enabled: true
    startupSeconds: 600

  # Snapshot bootstrap. An initContainer ALWAYS downloads and extracts the
  # latest official Mantle snapshot into the data PVC. It is a no-op on
  # subsequent restarts (it checks for an already-populated data directory),
  # so this is safe across upgrades.
  #
  # Per-network overrides set baseUrl / tarballSuffix / extractSubpath.
  snapshot:
    # S3 base URL holding `current.info` + `<date>-<tarballSuffix>` objects.
    baseUrl: ""
    # Suffix appended to "<date>-" to form the tarball filename.
    # Examples:
    #   hoodi    → "hoodi.tar.zst"
    #   sepolia  → "sepolia-chaindata.tar.zst"
    #   mainnet  → "mainnet-chaindata.tar.zst"
    tarballSuffix: ""
    # Subdirectory under `l2.persistence.mountPath` into which the tarball is
    # extracted. Empty means the data PVC root. Set to "geth" for op-geth.
    extractSubpath: ""
    # Init image used to download/extract the snapshot. Must provide a shell
    # and apk; the script installs curl + tar + zstd at runtime.
    image:
      repository: alpine
      tag: "3.20"
      pullPolicy: IfNotPresent

  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podLabels: {}

# -----------------------------------------------------------------------------
# op-node (rollup node). All OP_NODE_* env vars are network-specific and set
# in the per-network override files.
# -----------------------------------------------------------------------------
opNode:
  image:
    repository: mantlenetworkio/mantle-op-node
    tag: ""
    pullPolicy: IfNotPresent

  # Container ports (defaults match docker-compose).
  ports:
    rpc: 8545
    metrics: 7300
    pprof: 6060
    p2p: 9003

  service:
    type: ClusterIP
    annotations: {}
    nodePorts:
      rpc: ""

  # Environment variables passed to op-node. Network-agnostic defaults are set
  # here; the per-network override file fills in network-specific values.
  env:
    OP_NODE_L2_ENGINE_RPC: ""           # overridden in templates to point at the L2 service
    OP_NODE_L2_ENGINE_AUTH: /secret/jwt_secret_txt
    OP_NODE_ROLLUP_CONFIG: /config/rollup.json
    OP_NODE_P2P_PRIV_PATH: /secret/p2p_node_key_txt
    OP_NODE_VERIFIER_L1_CONFS: "3"
    OP_NODE_RPC_ADDR: 0.0.0.0
    OP_NODE_RPC_PORT: "8545"
    OP_NODE_P2P_LISTEN_IP: 0.0.0.0
    OP_NODE_P2P_LISTEN_TCP_PORT: "9003"
    OP_NODE_P2P_LISTEN_UDP_PORT: "9003"
    OP_NODE_P2P_PEER_SCORING: light
    OP_NODE_P2P_PEER_BANNING: "true"
    OP_NODE_METRICS_ENABLED: "true"
    OP_NODE_METRICS_ADDR: 0.0.0.0
    OP_NODE_METRICS_PORT: "7300"
    OP_NODE_PPROF_ENABLED: "true"
    OP_NODE_PPROF_PORT: "6060"
    OP_NODE_PPROF_ADDR: 0.0.0.0
    OP_NODE_P2P_DISCOVERY_PATH: /op-node/opnode_discovery_db
    OP_NODE_P2P_PEERSTORE_PATH: /op-node/opnode_peerstore_db
    OP_NODE_SEQUENCER_ENABLED: "false"
    OP_NODE_P2P_AGENT: mantle
    OP_NODE_P2P_SYNC_REQ_RESP: "true"
    # Set by per-network overrides:
    #   OP_NODE_L2_BACKUP_UNSAFE_SYNC_RPC
    #   OP_NODE_P2P_STATIC

  # Extra env entries (e.g. valueFrom secrets). Appended as-is.
  extraEnv: []

  resources:
    requests:
      cpu: "2"
      memory: "2Gi"
    limits:
      cpu: "4"
      memory: "8Gi"

  persistence:
    enabled: true
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 10Gi
    mountPath: /op-node

  probes:
    enabled: true
    startupSeconds: 600

  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podLabels: {}

# -----------------------------------------------------------------------------
# Service account for the pods.
# -----------------------------------------------------------------------------
serviceAccount:
  create: true
  name: ""
  annotations: {}

# -----------------------------------------------------------------------------
# Image pull secrets (for private registries).
# -----------------------------------------------------------------------------
imagePullSecrets: []
