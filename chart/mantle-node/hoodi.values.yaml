# Mantle Hoodi testnet preset.
# Mirrors docker-compose-hoodi-upgrade-beacon.yml.
#
# Before installing, fill in `l1.*` and `secrets.*` below, then run:
#   helm install hoodi ./chart/mantle-node -f ./chart/mantle-node/hoodi.values.yaml

network: hoodi

# REQUIRED: L1 endpoints. Fill these in before installing.
#   - l1.rpc:    L1 (Hoodi) execution-layer RPC URL
#   - l1.beacon: L1 (Hoodi) beacon/blob URL. You may also point this at the
#                Mantle DA indexer: https://da-indexer-api.hoodi.mantle.xyz
l1:
  rpc: ""
  beacon: ""

# REQUIRED: secrets. Both are 32-byte hex strings — generate with:
#   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
#   # or: openssl rand -hex 32
#   - secrets.jwtSecret:   engine-API JWT shared between op-node and op-reth
#   - secrets.p2pNodeKey:  op-node libp2p private key (stable peer identity)
secrets:
  jwtSecret: ""
  p2pNodeKey: ""

config:
  rollupJsonPath: networks/hoodi/rollup.json

el:
  kind: op-reth
  image:
    repository: mantlenetworkio/mantle-op-reth
    tag: v1.9.3-mantle-arsia.1
    pullPolicy: IfNotPresent
  command:
    - op-reth
  args:
    - node
    - -vvv
    # genesis.json comes from the snapshot init container (it is included in
    # the official Mantle Hoodi snapshot tarball under /db/genesis.json).
    - --chain=/db/genesis.json
    - --datadir=/db
    - --port=9003
    - --metrics=0.0.0.0:6060
    - --http
    - --http.corsdomain=*
    - --http.addr=0.0.0.0
    - --http.port=8545
    - --http.api=web3,debug,eth,txpool,net,admin
    - --ws
    - --ws.addr=0.0.0.0
    - --ws.port=8546
    - --ws.origins=*
    - --ws.api=debug,eth,txpool,net
    - --txpool.nolocals
    - --authrpc.addr=0.0.0.0
    - --authrpc.port=8551
    - --authrpc.jwtsecret=/secret/jwt_secret_txt
    - --rollup.sequencer-http=https://rpc.hoodi.mantle.xyz
    - --disable-discovery
    - --rpc.max-response-size=1024
    - --rpc.max-blocks-per-filter=10000
    - --rpc.eth-proof-window=100000
    - --min-suggested-priority-fee=100000
    - --engine.persistence-threshold=0
    - --engine.memory-block-buffer-target=0

  ports:
    http: 8545
    ws: 8546
    auth: 8551
    metrics: 6060
    p2p: 9003

  resources:
    requests:
      cpu: "2"
      memory: "8Gi"
    limits:
      cpu: "4"
      memory: "8Gi"

  persistence:
    enabled: true
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 100Gi
    mountPath: /db

  snapshot:
    baseUrl: https://s3.ap-southeast-1.amazonaws.com/snapshot.hoodi.mantle.xyz
    tarballSuffix: hoodi.tar.zst
    extractSubpath: ""

opNode:
  image:
    repository: mantlenetworkio/mantle-op-node
    tag: v1.5.4
    pullPolicy: IfNotPresent

  ports:
    rpc: 8545
    metrics: 7300
    pprof: 6060
    p2p: 9003

  resources:
    requests:
      cpu: "2"
      memory: "2Gi"
    limits:
      cpu: "4"
      memory: "8Gi"

  persistence:
    enabled: true
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 10Gi
    mountPath: /op-node

  env:
    OP_NODE_L2_ENGINE_AUTH: /secret/jwt_secret_txt
    OP_NODE_ROLLUP_CONFIG: /config/rollup.json
    OP_NODE_P2P_PRIV_PATH: /secret/p2p_node_key_txt
    OP_NODE_VERIFIER_L1_CONFS: "3"
    OP_NODE_RPC_ADDR: 0.0.0.0
    OP_NODE_RPC_PORT: "8545"
    OP_NODE_P2P_LISTEN_IP: 0.0.0.0
    OP_NODE_P2P_LISTEN_TCP_PORT: "9003"
    OP_NODE_P2P_LISTEN_UDP_PORT: "9003"
    OP_NODE_P2P_PEER_SCORING: light
    OP_NODE_P2P_PEER_BANNING: "true"
    OP_NODE_METRICS_ENABLED: "true"
    OP_NODE_METRICS_ADDR: 0.0.0.0
    OP_NODE_METRICS_PORT: "7300"
    OP_NODE_PPROF_ENABLED: "true"
    OP_NODE_PPROF_PORT: "6060"
    OP_NODE_PPROF_ADDR: 0.0.0.0
    OP_NODE_P2P_DISCOVERY_PATH: /op-node/opnode_discovery_db
    OP_NODE_P2P_PEERSTORE_PATH: /op-node/opnode_peerstore_db
    OP_NODE_SEQUENCER_ENABLED: "false"
    OP_NODE_P2P_AGENT: mantle
    OP_NODE_P2P_SYNC_REQ_RESP: "true"
    OP_NODE_L2_BACKUP_UNSAFE_SYNC_RPC: https://rpc.hoodi.mantle.xyz
    OP_NODE_P2P_STATIC: /dns4/peer0.hoodi.mantle.xyz/tcp/9003/p2p/16Uiu2HAm3n6Jq9rM1cTTCbV6Cq8AM7ZPWB3HXZwU5Uj1YvTctn7M,/dns4/peer1.hoodi.mantle.xyz/tcp/9003/p2p/16Uiu2HAmNU5hFapeWXmJc1gUchyWhrCoji4XJ3dGmyzAKqC1fgDi
